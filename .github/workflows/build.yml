name: Build Minecraft Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Find and build with Gradle
      run: |
        # Tìm thư mục chứa file gradlew tự động
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Không tìm thấy file gradlew!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Đã tìm thấy dự án tại: $PROJECT_DIR"
        
        # Phân quyền và build
        chmod +x "$GRADLEW_PATH"
        cd "$PROJECT_DIR"
        ./gradlew build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar-file
        path: "**/build/libs/*.jar"
